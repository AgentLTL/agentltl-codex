use: [no-codex-coauthor, read-before-overwrite, no-force-push]

rules:
  - id: no-sudo
    never: sudo
    why: Nothing in this project needs root.
  - id: ask-before-rm-r
    never: {tool: rm, with: {recursive: true}}
    mode: ask
    why: Deleting directories loses work.
  - id: commit-before-finishing
    finally:
      call: {tool: git_commit, succeeded: true}
      since: [Write, Edit]
    why: Work Codex changed should be committed before it hands back.
